name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # (a) Host unit tests: every firmware/tests/*.cc is a standalone program; non-zero exit = fail.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile and run host tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tests
          status=0
          for src in firmware/tests/*.cc; do
            name="$(basename "$src" .cc)"
            echo "::group::$name"
            g++ -std=c++17 -Wall -Wextra -O1 -I firmware/src/assistant -I firmware/src \
              -o "/tmp/tests/$name" "$src"
            if ! "/tmp/tests/$name"; then
              echo "::error file=$src::$name failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  # (b) Characters and apps are data: validate firmware/data/assistant.json.
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate assistant.json
        run: python3 firmware/scripts/validate_data.py firmware/data/assistant.json

  # (c) Formatting. Pinned to the clang-format version used locally so results match.
  clang-format:
    runs-on: ubuntu-latest
    # TODO: remove continue-on-error after the one-time reformat of firmware/src is committed
    # (clang-format -i on the files listed below).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install clang-format
        run: pip install clang-format==21.1.8
      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          # font_chat_24.c is a generated LVGL font; skip generated sources.
          mapfile -t files < <(find firmware/src -type f \( -name '*.cc' -o -name '*.h' -o -name '*.cpp' \) | sort)
          clang-format --version
          clang-format --dry-run --Werror "${files[@]}"

  # (d) Firmware build in the same ESP-IDF image as firmware/build.sh, with an EMPTY API key.
  # The resulting bap.bin has no key: set it later in the device web UI (http://bap.local).
  firmware:
    runs-on: ubuntu-latest
    needs: [unit-tests, validate-data]
    container:
      image: espressif/idf:release-v6.1
    env:
      LANG_CODE: vi-VN
      WAKE_WORD: hiesp
      GEMINI_MODEL: gemini-3.1-flash-live-preview
      GEMINI_VOICE: Leda
    steps:
      - uses: actions/checkout@v7

      - name: Recreate vendor/xiaozhi-esp32 (pinned upstream + patch)
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          bash firmware/scripts/apply_patch.sh

      # Mirrors the staging part of firmware/build.sh (copy sources, embed data, board config)
      # without reading secrets/ or calling docker.
      - name: Stage our sources into the upstream tree
        shell: bash
        run: |
          set -euo pipefail
          FW="$PWD/firmware"
          SRC="$PWD/vendor/xiaozhi-esp32"
          rm -rf "$SRC/main/assistant"; mkdir -p "$SRC/main/assistant"
          cp "$FW"/src/assistant/* "$SRC/main/assistant/"
          cp "$FW"/src/protocols/* "$SRC/main/protocols/"
          embed() {
            { echo '#pragma once'; echo "// Generated from firmware/$1 by CI"
              printf 'static const char %s[] = R"BAPDATA(' "$2"; cat "$FW/$1"; echo ')BAPDATA";'; } > "$3"
          }
          embed web/index.html kWebPage "$SRC/main/assistant/web_page.h"
          embed data/assistant.json kAssistantJson "$SRC/main/assistant/builtin_data.h"
          python3 - "$FW/config.home.json" "$SRC/main/boards/sensecap-watcher/config.home.json" <<'PY'
          import json, os, sys
          src, dst = sys.argv[1:3]
          cfg = json.load(open(src))
          app = [l for l in cfg["builds"][0]["sdkconfig_append"] if not l.startswith("CONFIG_OTA_URL")]
          app += ["CONFIG_USE_GEMINI_LIVE=y", 'CONFIG_GEMINI_API_KEY=""',
                  f'CONFIG_GEMINI_MODEL="{os.environ["GEMINI_MODEL"]}"',
                  f'CONFIG_GEMINI_VOICE="{os.environ["GEMINI_VOICE"]}"',
                  "CONFIG_SEND_WAKE_WORD_DATA=n"]
          app += [l.strip() for l in open(os.path.join(os.path.dirname(src), "sdkconfig.gemini"))
                  if l.strip() and not l.lstrip().startswith("#")]
          cfg["builds"][0]["sdkconfig_append"] = app
          json.dump(cfg, open(dst, "w"), indent=2)
          PY

      - name: Build
        shell: bash
        working-directory: vendor/xiaozhi-esp32
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py sensecap-watcher -c config.home.json \
            --language "$LANG_CODE" --wake-word "$WAKE_WORD"

      - name: Check the image carries no API key
        shell: bash
        run: |
          if grep -aqE 'AIza[0-9A-Za-z_-]{20,}' vendor/xiaozhi-esp32/build/xiaozhi.bin; then
            echo "::error::the firmware image contains an API key"; exit 1
          fi
          cp vendor/xiaozhi-esp32/build/xiaozhi.bin vendor/xiaozhi-esp32/build/bap.bin

      - uses: actions/upload-artifact@v7
        with:
          name: bap-${{ github.sha }}
          path: vendor/xiaozhi-esp32/build/bap.bin
          if-no-files-found: error

  # (e) Secret scan over the full git history.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --verbose --exit-code 1
