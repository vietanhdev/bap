<svg xmlns="http://www.w3.org/2000/svg" width="980" height="708" viewBox="0 0 980 708" role="img" aria-labelledby="t d">
<title id="t">Before and after performance</title>
<desc id="d">Horizontal bars comparing latency, CPU, firmware size and OTA time before and after optimization.</desc>

<style>
  svg { --bg:#f8f6ff; --card:#ffffff; --panel:#f0ecff; --ink:#1e1b2e; --muted:#6b6785;
        --line:#d6cff3; --accent:#7c5cff; --accent2:#a594ff; --soft:#ece6ff; --shadow:#2a1f66;
        --shadowop:0.10; --before:#d9d4ea; --corn:#e8b520; --avo:#6fa83a; --pink:#e57aa3;
        --sky:#3f9fd6; --danger:#e0567a; --ok:#2f9e6a; --chip:#f3f0ff; --onaccent:#ffffff; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#15131f; --card:#1e1b2e; --panel:#1a1828; --ink:#f1eefc; --muted:#a39fbd;
          --line:#3a3454; --accent:#a594ff; --accent2:#7c5cff; --soft:#2a2540; --shadow:#000000;
          --shadowop:0.45; --before:#3c3756; --corn:#f5c84b; --avo:#8bc34a; --pink:#f7a8c4;
          --sky:#7ec8f0; --danger:#ff7c9c; --ok:#5fd39a; --chip:#262238; --onaccent:#15131f; }
  }
  text { font-family: Nunito, Inter, 'Segoe UI', system-ui, -apple-system, sans-serif; fill: var(--ink); }
  .bg { fill: var(--bg); }
  .card { fill: var(--card); stroke: var(--line); stroke-width: 1; }
  .panel { fill: var(--panel); stroke: var(--accent2); stroke-width: 1.5; stroke-dasharray: 6 5; }
  .soft { fill: var(--soft); }
  .chip { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
  .accentf { fill: var(--accent); }
  .accent2f { fill: var(--accent2); }
  .beforef { fill: var(--before); }
  .cornf { fill: var(--corn); } .avof { fill: var(--avo); } .pinkf { fill: var(--pink); }
  .skyf { fill: var(--sky); } .dangerf { fill: var(--danger); } .okf { fill: var(--ok); }
  .t-title { font-size: 24px; font-weight: 800; letter-spacing: -0.2px; }
  .t-sub { font-size: 14px; fill: var(--muted); }
  .t-h { font-size: 15.5px; font-weight: 800; }
  .t-b { font-size: 14px; font-weight: 600; }
  .t-s { font-size: 13px; fill: var(--muted); }
  .t-xs { font-size: 12px; fill: var(--muted); }
  .t-mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 13px; }
  .t-on { fill: var(--onaccent); }
  .t-accent { fill: var(--accent); }
  .t-danger { fill: var(--danger); }
  .t-ok { fill: var(--ok); }
  .line { stroke: var(--muted); stroke-width: 1.6; fill: none; }
  .aline { stroke: var(--accent); stroke-width: 2; fill: none; }
  .dline { stroke: var(--muted); stroke-width: 1.4; fill: none; stroke-dasharray: 4 4; }
  .life { stroke: var(--line); stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; }
  .ds { flood-color: var(--shadow); flood-opacity: var(--shadowop); }
  .mk { fill: var(--muted); } .mka { fill: var(--accent); }
</style>

<defs>
  <filter id="sh" x="-8%" y="-15%" width="116%" height="140%">
    <feDropShadow class="ds" dx="0" dy="3" stdDeviation="5"/>
  </filter>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="mk" d="M0,1 L10,5 L0,9 z"/>
  </marker>
  <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="mka" d="M0,1 L10,5 L0,9 z"/>
  </marker>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8f6bff"/><stop offset="1" stop-color="#5b8cff"/>
  </linearGradient>
  <linearGradient id="gradwarm" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd84d"/><stop offset="1" stop-color="#ff9eb5"/>
  </linearGradient>
</defs>
<rect class="bg" x="0" y="0" width="980" height="708" rx="22"/>
<text x="32" y="48" class="t-title">Optimization results</text>
<text x="32" y="72" class="t-sub">Measured on a SenseCAP Watcher over the course of the tuning work.</text>
<text x="40" y="140" class="t-xs" style="letter-spacing:1.4px;font-weight:800">LATENCY</text>
<line x1="116" y1="136" x2="940" y2="136" class="dline" style="stroke:var(--line)"/>
<text x="40" y="181" class="t-b">Wake → listening</text>
<rect x="250" y="160" width="520" height="14" rx="7" class="beforef"/>
<rect x="250" y="180" width="322.8" height="14" rx="7" fill="url(#grad)"/>
<text x="780" y="172" class="t-s">2.9 s</text>
<text x="582.7586206896551" y="192" class="t-b t-accent">1.8 s</text>
<rect x="880" y="164" width="60" height="28" rx="14.0" class="soft"/>
<text x="910.0" y="182.5" class="t-b t-accent" text-anchor="middle">−38%</text>
<text x="40" y="233" class="t-b">TLS handshake</text>
<rect x="250" y="212" width="520" height="14" rx="7" class="beforef"/>
<rect x="250" y="232" width="38.2" height="14" rx="7" fill="url(#grad)"/>
<text x="780" y="224" class="t-s">1.36 s</text>
<text x="298.2352941176471" y="244" class="t-b t-accent">0.10 s</text>
<rect x="880" y="216" width="60" height="28" rx="14.0" class="soft"/>
<text x="910.0" y="234.5" class="t-b t-accent" text-anchor="middle">−93%</text>
<text x="40" y="285" class="t-b">Zing song search</text>
<rect x="250" y="264" width="520" height="14" rx="7" class="beforef"/>
<rect x="250" y="284" width="208.0" height="14" rx="7" fill="url(#grad)"/>
<text x="780" y="276" class="t-s">2.5 s</text>
<text x="468.0" y="296" class="t-b t-accent">1.0 s</text>
<rect x="880" y="268" width="60" height="28" rx="14.0" class="soft"/>
<text x="910.0" y="286.5" class="t-b t-accent" text-anchor="middle">−60%</text>
<text x="40" y="337" class="t-b">Weather lookup</text>
<rect x="250" y="316" width="520" height="14" rx="7" class="beforef"/>
<rect x="250" y="336" width="234.0" height="14" rx="7" fill="url(#grad)"/>
<text x="780" y="328" class="t-s">6.0 s</text>
<text x="494.0" y="348" class="t-b t-accent">2.7 s</text>
<rect x="880" y="320" width="60" height="28" rx="14.0" class="soft"/>
<text x="910.0" y="338.5" class="t-b t-accent" text-anchor="middle">−55%</text>
<text x="40" y="388" class="t-xs" style="letter-spacing:1.4px;font-weight:800">CPU (DISPLAY TASK)</text>
<line x1="212" y1="384" x2="940" y2="384" class="dline" style="stroke:var(--line)"/>
<text x="40" y="429" class="t-b">Listening face</text>
<rect x="250" y="408" width="520" height="14" rx="7" class="beforef"/>
<rect x="250" y="428" width="160.0" height="14" rx="7" fill="url(#grad)"/>
<text x="780" y="420" class="t-s">19.5 %</text>
<text x="420.0" y="440" class="t-b t-accent">6.0 %</text>
<rect x="880" y="412" width="60" height="28" rx="14.0" class="soft"/>
<text x="910.0" y="430.5" class="t-b t-accent" text-anchor="middle">−69%</text>
<text x="40" y="481" class="t-b">Music playing</text>
<rect x="250" y="460" width="520" height="14" rx="7" class="beforef"/>
<rect x="250" y="480" width="46.0" height="14" rx="7" fill="url(#grad)"/>
<text x="780" y="472" class="t-s">14.7 %</text>
<text x="305.98639455782313" y="492" class="t-b t-accent">1.3 %</text>
<rect x="880" y="464" width="60" height="28" rx="14.0" class="soft"/>
<text x="910.0" y="482.5" class="t-b t-accent" text-anchor="middle">−91%</text>
<text x="40" y="532" class="t-xs" style="letter-spacing:1.4px;font-weight:800">SIZE &amp; UPDATE</text>
<line x1="168" y1="528" x2="940" y2="528" class="dline" style="stroke:var(--line)"/>
<text x="40" y="573" class="t-b">Firmware image</text>
<rect x="250" y="552" width="520" height="14" rx="7" class="beforef"/>
<rect x="250" y="572" width="449.4" height="14" rx="7" fill="url(#grad)"/>
<text x="780" y="564" class="t-s">3.83 MB</text>
<text x="709.3994778067886" y="584" class="t-b t-accent">3.31 MB</text>
<rect x="880" y="556" width="60" height="28" rx="14.0" class="soft"/>
<text x="910.0" y="574.5" class="t-b t-accent" text-anchor="middle">−14%</text>
<text x="40" y="625" class="t-b">OTA upload</text>
<rect x="250" y="604" width="520" height="14" rx="7" class="beforef"/>
<rect x="250" y="624" width="153.2" height="14" rx="7" fill="url(#grad)"/>
<text x="780" y="616" class="t-s">112 s</text>
<text x="413.2142857142857" y="636" class="t-b t-accent">33 s</text>
<rect x="880" y="608" width="60" height="28" rx="14.0" class="soft"/>
<text x="910.0" y="626.5" class="t-b t-accent" text-anchor="middle">−71%</text>
<rect x="250" y="664" width="28" height="12" rx="6" class="beforef"/>
<text x="286" y="674" class="t-s">before</text>
<rect x="360" y="664" width="28" height="12" rx="6" fill="url(#grad)"/>
<text x="396" y="674" class="t-s">after (lower is better, each row on its own scale)</text>
</svg>
